schema: spec-driven

context: |
  Language: German
  All artifacts must be written in German.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: Flauschiversum (https://flauschiversum.de/) – ein deutschsprachiger
  Handarbeits-/Strick-/Häkel-Blog ("Mehr als nur eine Masche").

  Tech-Stack:
  - Statischer Site-Generator in Rust (src/), ein Binary `flauschiversum`
    mit den Befehlen build, check und serve (Aufruf: cargo run --release -- build)
  - Inhalte als Markdown mit Frontmatter: content/posts/<verzeichnis>/ (Posts inkl.
    Medien, URL über `permalink`), content/pages/ (Einzelseiten)
  - Templates mit Askama (templates/, beim Kompilieren geprüft), Styles als
    Standard-CSS (content/style/, gebündelt mit lightningcss)
  - Bilder: drei Größen (200/700/1000), Badge-Wasserzeichen, Rechte-Metadaten,
    inkrementeller Cache in .cache/, parallel mit rayon
  - Themen und Suche: feste Liste content/tags.yaml (keine Kategorien, Themen = Schlagworte);
    Seiten /themen/, /tag/<name>/, /suche/, Weiterleitungen alter Adressen in content/redirects.yaml; Topbar mit den Links Beiträge, Themen, Tipps und Tricks (About me im Footer); Startseite mit
    Begrüßung (content/start.md) und Beiträgen, /beitraege/ mit Archiv nach Jahr und Monat;
    Suchindex mit dem Crate `pagefind` (Bibliothek) unter /pagefind/
  - Staging: GitHub Actions (.github/workflows/staging.yml) baut bei Push auf `dev` und
    `claude/**` mit `--staging <Branch>` und `--base-url` und veröffentlicht auf GitHub Pages
    (https://staging.flauschiversum.de/); Produktiv-Deployment ist ein eigener Change
  - Farben: Schema „Flauschi-Nebel“ in Hell und Dunkel, Variablen nur in
    content/style/theme.css, Umschalter in der Topbar, Sterne/Nebel in starfield.css
  - Frontend: Karussell (CSS scroll-snap) und Vollbild (PhotoSwipe 5) in assets/
  - Tests: cargo test (Unit, Integration, Snapshots mit insta), Browser-Tests mit
    Playwright in tests/browser/
  - Grundsatz: Cool URIs don't change – bestehende URLs bleiben erhalten

# Zusätzliche Schritte beim Archivieren eines Changes
operations:
  archive:
    guidance:
      - >-
        Nach erfolgreichem Archivieren (Archiv-Commit erstellt und gepusht) einen
        annotierten Git-Tag `changes/<Archivordner-Name>` auf diesen Commit setzen,
        z.B. `changes/2026-10-11-rust-neubau`, und den Tag pushen. So lässt sich der
        Stand jedes abgeschlossenen Changes im Review nachvollziehen. Schlägt das
        Pushen des Tags fehl, den lokalen Tag trotzdem anlegen und dem Nutzer den
        Befehl zum Nachholen nennen, statt die Sperre zu umgehen.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
