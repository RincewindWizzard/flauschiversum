schema: spec-driven

context: |
  Language: German
  All artifacts must be written in German.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: Flauschiversum (https://flauschiversum.de/) – ein deutschsprachiger
  Handarbeits-/Strick-/Häkel-Blog ("Mehr als nur eine Masche").

  Tech-Stack:
  - Eigener statischer Site-Generator in Python 3 (blogcompile/), Einstieg main.py
    (python3 main.py --dst build --cache .cache)
  - Inhalte als Markdown mit Frontmatter: src/posts/<slug>/ (Posts inkl. Bilder),
    src/pages/ (Einzelseiten wie Impressum, Autoren, Tipps)
  - Templates in Jinja2 (templates/), Styles in LessCSS (src/style/, kompiliert mit lessc)
  - Bilder werden mit Pillow skaliert und mit Wasserzeichen versehen (Cache in .cache)
  - RSS-Feed via feedgen, HTML-Minifizierung via htmlmin
  - Tests in test/ (unittest)
  - Deployment: Docker (docker/, docker-compose.yml), ausgeliefert über nginx

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
