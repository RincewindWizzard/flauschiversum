[tool.poetry]
name = "flauschiversum"
version = "0.1.0"
description = "Software, die das Flauschiversum bereitstellt."
authors = ["RincewindWizzard <git@magierdinge.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
Pillow = "^9.2.0"
htmlmin = "^0.1.12"
beautifulsoup4 = "^4.11.1"
python-slugify = "^6.1.2"
python-frontmatter = "^1.0.0"
Markdown = "<=3.1"
Jinja2 = "^3.1.2"
requests = "^2.28.1"
feedgen = "^0.9.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
flauschiversum-build = 'flauschiversum.__main__:main'
