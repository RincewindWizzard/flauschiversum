    Spinne, häkel, webe, sticke,
    knüpfe dir nur keine Stricke.
  intro: "Spinnen, Weben, Stricken, Häkeln und Filzen: Anleitungen und Ideen rund um Wolle in allen Lebenslagen. Wer etwas zum Filzen sucht, findet es über das Schlagwort „Filzen“."
