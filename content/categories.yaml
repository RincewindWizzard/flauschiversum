# Erlaubte Kategorien. Der Wert von `category` in einem Beitrag ist die `id`; jeder Beitrag hat genau eine.
# Die Reihenfolge bestimmt die Reihenfolge im Menü „Kategorien“. `intro` ist der kurze Einleitungstext auf der Kategorieseite (Markdown).
# Feinere Unterscheidungen (z. B. Filzen, Stricken, Häkeln) laufen über Schlagworte in content/tags.yaml.
- id: wolle
