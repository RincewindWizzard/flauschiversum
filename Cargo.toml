[package]
name = "flauschiversum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_yaml_ng = "0.10.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
