{% extends "layout.html" %}
{% block content %}
<main class="topic topics-overview">
  <header class="topic-head">
    <h1>Themen</h1>
    <p class="count">{{ tags.len() }} Themen zum Stöbern</p>
  </header>
  <ul class="taglist">
    {%- for t in tags %}
    <li><a href="{{ t.url }}">{{ t.name }}{% if let Some(n) = t.count %} <span class="count">({{ n }})</span>{% endif %}</a></li>
    {%- endfor %}
  </ul>
</main>
{% endblock %}
